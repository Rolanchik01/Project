[package]
name = "momentum-live"
version = "0.1.0"
edition.workspace = true

[dependencies]
momentum-pump = { version = "0.1.0", path = "../pump" }
momentum-pumpswap = { version = "0.1.0", path = "../pumpswap" }
solana-pubkey = "3"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[dev-dependencies]
