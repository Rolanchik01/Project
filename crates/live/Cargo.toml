[package]
name = "momentum-live"
version = "0.1.0"
edition.workspace = true

[dependencies]
momentum-core = { version = "0.1.0", path = "../core" }
momentum-ingest = { version = "0.1.0", path = "../ingest" }
momentum-pump = { version = "0.1.0", path = "../pump" }
momentum-pumpswap = { version = "0.1.0", path = "../pumpswap" }
momentum-reputation = { version = "0.1.0", path = "../reputation" }
momentum-token2022 = { version = "0.1.0", path = "../token2022" }
solana-pubkey = "3"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
